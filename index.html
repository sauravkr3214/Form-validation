<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://kit.fontawesome.com/535d958ca4.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conatainer">
        <form>
            <i class="fa-solid fa-paper-plane"></i>
            <div class="form-page">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" id="contact-name" onkeyup="validateName()">
                <span id="name-error"></span>
            </div>
            <div class="form-page">
                <label>Phone No</label>
                <input type="tel" placeholder="Enter your number" id="contact-phone" onkeyup="validatePhone()">
                <span id="phone-error"></span>
            </div>
            <div class="form-page">
                <label>Email Id</label>
                <input type="email" placeholder="Enter your email" id="contact-email" onkeyup="validateEmail()">
                <span id="email-error"></span>
            </div>
            <div class="form-page">
                <label>Your Message</label>
                <textarea  rows="5" placeholder="Enter your message" id="contact-message" onkeyup="validateMessage()"></textarea>
                <span id="Message-error"></span>
            </div>
            <button onclick="return validateForm()">Submit</button>
            <span id="submit-error"></span>
        </form>
    </div>
    <script src="formvalidation.js"></script>
</body>
</html>
